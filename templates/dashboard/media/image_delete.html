{% extends "dashboard/base.html" %}

{% block title %}Delete Photo{% endblock %}

{% block content %}

<div class="mx-auto max-w-lg">

    <div class="rounded-2xl border border-red-200 bg-white shadow-sm">

        <!-- Header -->

        <div class="border-b border-red-100 px-6 py-5">

            <div class="flex items-center gap-3">

                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-red-50 text-red-600">

                    <i class="fa-solid fa-trash"></i>

                </div>

                <div>

                    <h1 class="font-semibold text-slate-900">
                        Delete Photo
                    </h1>

                    <p class="text-sm text-slate-500">
                        This action cannot be undone.
                    </p>

                </div>

            </div>

        </div>


        <!-- Content -->

        <div class="space-y-5 p-6">

            <!-- Image Preview -->

            <div class="overflow-hidden rounded-xl border border-slate-200 bg-slate-50">

                <img
                    src="{{ image.image.url }}"
                    alt="{{ image.alt_text|default:image.caption|default:image.album.title }}"
                    class="max-h-72 w-full object-contain"
                >

            </div>


            <!-- Warning -->

            <div class="rounded-xl bg-red-50 p-4">

                <p class="text-sm leading-6 text-red-700">

                    Are you sure you want to delete this photo from

                    <strong>
                        {{ image.album.title }}
                    </strong>?

                    The photo will be permanently removed.

                </p>

            </div>


            <!-- Actions -->

            <form method="post">

                {% csrf_token %}

                <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">

                    <a
                        href="{% url 'media:album_manage' image.album.pk %}"
                        class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
                    >
                        <i class="fa-solid fa-arrow-left"></i>
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="inline-flex items-center justify-center gap-2 rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700"
                    >
                        <i class="fa-solid fa-trash"></i>
                        Delete Photo
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
