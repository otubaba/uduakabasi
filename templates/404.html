{% extends "base.html" %}
{% load static %}

{% block title %}Page Not Found | UDUAK-ABASI 2027{% endblock %}

{% block content %}

<section class="relative min-h-[80vh] flex items-center justify-center overflow-hidden">

<!-- Background Logo -->
<div
    class="absolute inset-0 bg-center bg-cover bg-no-repeat bg-fixed opacity-[0.06]"
    style="background-image: url('{% static "images/adc-logo.jpg" %}');"
></div>

<!-- Content -->
<div class="relative z-10 w-full max-w-3xl mx-auto px-6 text-center">

    <div class="mb-6">
        <span class="text-8xl md:text-9xl font-black text-campaign-navy">
            404
        </span>
    </div>

    <h1 class="text-3xl md:text-5xl font-extrabold text-campaign-navy mb-4">
        Page Not Found
    </h1>

    <p class="text-lg md:text-xl text-slate-600 max-w-xl mx-auto mb-8">
        Sorry, the page you are looking for doesn't exist or the link
        may have been entered incorrectly.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">

        <a
            href="{% url 'core:home' %}"
            class="btn-gold inline-flex items-center justify-center px-7 py-3 rounded-lg font-semibold"
        >
            ← Back to Home
        </a>

        <a
            href="{% url 'core:contact' %}"
            class="btn-outline inline-flex items-center justify-center px-7 py-3 rounded-lg font-semibold"
        >
            Contact Us
        </a>

    </div>

</div>

</section>

{% endblock %}
